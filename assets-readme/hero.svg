<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="A small platformer character running and jumping">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ec3ff"/><stop offset="1" stop-color="#cdeeff"/>
    </linearGradient>
  </defs>
  <style>
    .far { animation: scroll450 18s linear infinite; }
    .near { animation: scroll300 9s linear infinite; }
    .ground { animation: scroll60 0.4s linear infinite; }
    @keyframes scroll450 { to { transform: translateX(-450px); } }
    @keyframes scroll300 { to { transform: translateX(-300px); } }
    @keyframes scroll60 { to { transform: translateX(-60px); } }
    .cloud { animation: drift 30s linear infinite; }
    .cloud.c2 { animation-duration: 44s; animation-delay: -18s; }
    .cloud.c3 { animation-duration: 36s; animation-delay: -9s; }
    @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(1020px); } }
    .obstacle { animation: pass 6.8s linear infinite; }
    .coins { animation: pass 6.8s linear infinite; animation-delay: -2.6s; }
    @keyframes pass { from { transform: translateX(960px); } to { transform: translateX(-340px); } }
    .spin { animation: spin 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes spin { 0%,100% { transform: scaleX(1); } 50% { transform: scaleX(0.25); } }
    .hero { animation: jump 6.8s infinite; }
    @keyframes jump {
      0%, 66% { transform: translateY(0); animation-timing-function: cubic-bezier(.2,.7,.4,1); }
      74% { transform: translateY(-74px); animation-timing-function: cubic-bezier(.6,0,.8,.4); }
      84%, 100% { transform: translateY(0); }
    }
    .bob { animation: bob 0.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .leg { transform-box: fill-box; transform-origin: 50% 0; animation: stride 0.4s ease-in-out infinite; }
    .leg.b { animation-delay: -0.2s; }
    @keyframes stride { 0%,100% { transform: rotate(-38deg); } 50% { transform: rotate(38deg); } }
    .arm { transform-box: fill-box; transform-origin: 50% 0; animation: stride 0.4s ease-in-out infinite; animation-delay: -0.2s; }
    .dust { animation: dust 0.5s ease-out infinite; transform-box: fill-box; }
    .dust.d2 { animation-delay: -0.25s; }
    @keyframes dust { from { transform: translate(0,0) scale(1); opacity: .7; } to { transform: translate(-26px,-8px) scale(.3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="900" height="240" fill="url(#sky)"/>
  <circle cx="780" cy="52" r="26" fill="#fff3a8"/>
  <g fill="#fff" opacity=".9">
    <g transform="translate(0 40)"><g class="cloud"><ellipse cx="0" cy="0" rx="42" ry="13"/><ellipse cx="24" cy="-8" rx="26" ry="11"/></g></g>
    <g transform="translate(0 88)"><g class="cloud c2"><ellipse cx="0" cy="0" rx="54" ry="15"/><ellipse cx="-22" cy="-9" rx="28" ry="12"/></g></g>
    <g transform="translate(0 24)"><g class="cloud c3"><ellipse cx="0" cy="0" rx="36" ry="11"/><ellipse cx="18" cy="-7" rx="22" ry="9"/></g></g>
  </g>

  <g class="far"><path d="M0 188 Q112.5 78 225 188 T450 188 V240 H0 Z" fill="#9ad7e8"/><path d="M450 188 Q562.5 78 675 188 T900 188 V240 H450 Z" fill="#9ad7e8"/><path d="M900 188 Q1012.5 78 1125 188 T1350 188 V240 H900 Z" fill="#9ad7e8"/><path d="M1350 188 Q1462.5 78 1575 188 T1800 188 V240 H1350 Z" fill="#9ad7e8"/></g>
  <g class="near"><path d="M0 188 Q75 118 150 188 T300 188 V240 H0 Z" fill="#6fc98a"/><path d="M300 188 Q375 118 450 188 T600 188 V240 H300 Z" fill="#6fc98a"/><path d="M600 188 Q675 118 750 188 T900 188 V240 H600 Z" fill="#6fc98a"/><path d="M900 188 Q975 118 1050 188 T1200 188 V240 H900 Z" fill="#6fc98a"/><path d="M1200 188 Q1275 118 1350 188 T1500 188 V240 H1200 Z" fill="#6fc98a"/></g>

