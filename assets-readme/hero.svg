      <rect x="-13" y="-50" width="26" height="22" rx="5" fill="#f6f4ee"/>
      <rect class="arm" x="5" y="-46" width="7" height="20" rx="3" fill="#f1b98f"/>
      <rect x="-13" y="-78" width="26" height="26" rx="7" fill="#f1b98f"/>
      <path d="M-14 -66 Q-14 -84 0 -84 Q14 -84 14 -66 L14 -70 Q0 -78 -14 -70 Z" fill="#2a1d18"/>
      <rect x="-14" y="-80" width="28" height="9" rx="4" fill="#2a1d18"/>
