t="38" fill="#936240"/><rect x="606" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="660" y="188" width="60" height="14" fill="#6fcf7f"/><rect x="660" y="202" width="60" height="38" fill="#8a5a3a"/><rect x="666" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="720" y="188" width="60" height="14" fill="#7fd98f"/><rect x="720" y="202" width="60" height="38" fill="#936240"/><rect x="726" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="780" y="188" width="60" height="14" fill="#6fcf7f"/><rect x="780" y="202" width="60" height="38" fill="#8a5a3a"/><rect x="786" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="840" y="188" width="60" height="14" fill="#7fd98f"/><rect x="840" y="202" width="60" height="38" fill="#936240"/><rect x="846" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="900" y="188" width="60" height="14" fill="#6fcf7f"/><rect x="900" y="202" width="60" height="38" fill="#8a5a3a"/><rect x="906" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="960" y="188" width="60" height="14" fill="#7fd98f"/><rect x="960" y="202" width="60" height="38" fill="#936240"/><rect x="966" y="216" width="10" height="8" rx="2" fill="#7a4d30"/><rect x="1020" y="188" width="60" height="14" fill="#6fcf7f"/><rect x="1020" y="202" width="60" height="38" fill="#8a5a3a"/><rect x="1026" y="216" width="10" height="8" rx="2" fill="#7a4d30"/></g>

  <g class="coins" transform="translate(0 0)"><g transform="translate(0 112.0)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g><g transform="translate(46 95.0)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g><g transform="translate(92 82.6)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g><g transform="translate(138 78.0)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g><g transform="translate(184 82.6)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g><g transform="translate(230 95.0)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g><g transform="translate(276 112.0)"><ellipse class="spin" cx="0" cy="0" rx="9" ry="9" fill="#ffd34d" stroke="#e0a21f" stroke-width="2"/></g></g>

  <g class="obstacle">
    <rect x="0" y="150" width="44" height="38" rx="4" fill="#c77b3b"/>
    <rect x="0" y="150" width="44" height="8" rx="3" fill="#e09a55"/>
    <rect x="9" y="164" width="26" height="4" fill="#9b5a25"/>
  </g>

  <g class="hero-pos" transform="translate(190 188)">
    <g class="dust"><circle cx="-10" cy="-4" r="5" fill="#fff"/></g>
    <g class="dust d2"><circle cx="-10" cy="-4" r="4" fill="#fff"/></g>
    <g class="hero"><g class="bob">
      <rect class="leg b" x="-3" y="-20" width="8" height="20" rx="3" fill="#2f4a8a"/>
      <rect class="arm" x="-12" y="-46" width="7" height="20" rx="3" fill="#f1b98f"/>
      <rect x="-12" y="-52" width="24" height="34" rx="6" fill="#f6f4ee"/>
